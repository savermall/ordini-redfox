<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Red Fox — Pannello</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=26">
<style>
 body{background:#f7f8f7}
 .adm{max-width:1180px;margin:0 auto;padding:20px}
 .adm h1{font-size:22px;margin:0 0 4px}
 .adm p.sub{color:var(--grigio);font-size:13px;margin:0 0 18px}
 .toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
 .toolbar input[type=search]{flex:1;min-width:220px;padding:10px 12px;border:1px solid var(--bordo);border-radius:10px}
 table.adm-t{width:100%;border-collapse:collapse;background:#fff;border:1px solid var(--bordo);border-radius:12px;overflow:hidden;font-size:13.5px}
 table.adm-t th{text-align:left;font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--grigio);padding:9px 10px;border-bottom:1px solid var(--bordo);background:#fbfbfb}
 table.adm-t td{padding:7px 10px;border-bottom:1px solid #f3f4f6;vertical-align:middle}
 table.adm-t input[type=number]{width:88px;padding:6px;border:1px solid var(--bordo);border-radius:8px;text-align:right}
 .pill{font-size:11px;background:var(--verde-chiaro);color:var(--verde-scuro);border-radius:999px;padding:2px 8px;font-weight:600;border:0;cursor:pointer}
 .pill.off{background:#fdecea;color:#8c2318}
 .thumb{width:56px;height:42px;object-fit:cover;border-radius:6px;background:#eef2ef;display:block}
 .foto-cell{display:flex;gap:8px;align-items:center}
 .foto-cell label{font-size:11px;color:var(--verde);cursor:pointer;font-weight:600}
 .foto-cell input[type=file]{display:none}
</style>
</head>
<body>
<div class="adm">
  <h1>Pannello Red Fox</h1>
  <p class="sub">Puoi cambiare <b>prezzi</b>, <b>disponibilità</b> e <b>foto</b>. Tutto resta nel tuo browser; premi <b>Esporta modifiche</b> e mandami il file: pubblico io (per ora).</p>

  <div class="toolbar">
    <input id="admCerca" type="search" placeholder="Cerca varietà o codice…">
    <select id="admCat" style="padding:9px;border:1px solid var(--bordo);border-radius:10px;max-width:260px"></select>
    <button class="btn ghost" id="admEsporta">Esporta modifiche (.zip)</button>
    <button class="btn pericolo" id="admReset">Azzera</button>
  </div>

  <div id="admStato" class="avviso info" style="margin-bottom:12px;display:none"></div>

  <table class="adm-t">
    <thead><tr><th style="width:70px">Foto</th><th style="width:80px">Codice</th><th>Varietà</th><th>Categoria</th><th style="width:110px">€/pianta</th><th style="width:100px">Disp.</th></tr></thead>
    <tbody id="admBody"></tbody>
  </table>
</div>

<script src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script src="data.js?v=26"></script>
<script>
(function(){
  var LS='redfox_admin_v1';
  var mods={}; try{ mods=JSON.parse(localStorage.getItem(LS)||'{}'); }catch(e){}
  var fotos={};                      // code -> dataURL
  var C=window.CATALOGO;
  var body=document.getElementById('admBody');

  // IndexedDB per le foto
  var db=null;
  function openDB(){ return new Promise(function(res,rej){
    var r=indexedDB.open('redfox_admin',1);
    r.onupgradeneeded=function(e){ e.target.result.createObjectStore('foto'); };
    r.onsuccess=function(e){ res(e.target.result); };
    r.onerror=function(){ rej(); };
  }); }
  function loadFotos(){
    return openDB().then(function(d){ db=d; return new Promise(function(res){
      var tx=db.transaction('foto','readonly').objectStore('foto'), req=tx.openCursor();
      req.onsuccess=function(e){ var c=e.target.result; if(c){ fotos[c.key]=c.value; c.continue(); } else res(); };
      req.onerror=function(){ res(); };
    }); });
  }
  function saveFoto(code,dataUrl){
    fotos[code]=dataUrl;
    if(!db) return;
    db.transaction('foto','readwrite').objectStore('foto').put(dataUrl,code);
  }
  function delFoto(code){ delete fotos[code]; if(db) db.transaction('foto','readwrite').objectStore('foto').delete(code); }

  var sel=document.getElementById('admCat'), q=document.getElementById('admCerca');
  sel.innerHTML='<option value="">Tutte le categorie</option>'+C.categorie.map(function(c){ return '<option>'+c.nome+'</option>'; }).join('');

  function render(){
    var cat=sel.value, k=q.value.trim().toLowerCase();
    var list=C.articoli.filter(function(a){
      if(cat && a.categoria!==cat) return false;
      if(k && (a.codice+' '+a.descrizione).toLowerCase().indexOf(k)<0) return false;
      return true;
    }).slice(0,300);
    body.innerHTML=list.map(function(a){
      var m=mods[a.codice]||{};
      var pr=m.prezzo!==undefined?m.prezzo:(a.costo!=null?a.costo:'');
      var dis=m.dispo===undefined?true:m.dispo;
      var src=fotos[a.codice]||a.foto||'';
      return '<tr><td><div class="foto-cell">'+
        (src?'<img class="thumb" src="'+src+'" alt="">':'<div class="thumb"></div>')+
        '<label>Cambia<input type="file" accept="image/*" data-foto="'+a.codice+'"></label></div></td>'+
        '<td>'+a.codice+'</td><td>'+a.descrizione+'</td><td style="color:var(--grigio)">'+a.categoria+'</td>'+
        '<td><input type="number" step="0.001" min="0" data-code="'+a.codice+'" value="'+pr+'"></td>'+
        '<td><button class="pill '+(dis?'':'off')+'" data-toggle="'+a.codice+'">'+(dis?'Sì':'No')+'</button></td></tr>';
    }).join('');
  }

  body.addEventListener('input',function(e){
    var c=e.target.getAttribute('data-code'); if(!c) return;
    mods[c]=mods[c]||{}; mods[c].prezzo=parseFloat(e.target.value); saveMods();
  });
  body.addEventListener('click',function(e){
    var c=e.target.getAttribute('data-toggle'); if(!c) return;
    mods[c]=mods[c]||{}; mods[c].dispo=!(mods[c].dispo===undefined?true:mods[c].dispo);
    saveMods(); render();
  });
  body.addEventListener('change',function(e){
    var c=e.target.getAttribute('data-foto'); if(!c) return;
    var f=e.target.files&&e.target.files[0]; if(!f) return;
    var img=new Image(), fr=new FileReader();
    fr.onload=function(){
      img.onload=function(){
        var w=img.width, h=img.height, max=600;
        if(w>max){ h=Math.round(h*max/w); w=max; }
        var cv=document.createElement('canvas'); cv.width=w; cv.height=h;
        cv.getContext('2d').drawImage(img,0,0,w,h);
        saveFoto(c, cv.toDataURL('image/jpeg',0.85));
        render(); mostra('Foto aggiornata per '+c+' (salvata nel browser).');
      };
      img.src=fr.result;
    };
    fr.readAsDataURL(f);
  });

  function saveMods(){ localStorage.setItem(LS,JSON.stringify(mods)); }
  function mostra(t){ var s=document.getElementById('admStato'); s.textContent=t; s.style.display='block'; clearTimeout(window.__t); window.__t=setTimeout(function(){ s.style.display='none'; },5000); }

  document.getElementById('admReset').onclick=function(){
    if(!confirm('Azzerare prezzi, disponibilità e foto?')) return;
    mods={}; fotos={}; localStorage.removeItem(LS);
    if(db) db.transaction('foto','readwrite').objectStore('foto').clear();
    render(); mostra('Azzerato.');
  };

  document.getElementById('admEsporta').onclick=async function(){
    var zip=new JSZip();
    var n=0;
    for(var c in fotos){
      var b64=fotos[c].split(',')[1];
      zip.file('img/p/'+c+'.jpg', b64, {base64:true}); n++;
    }
    zip.file('modifiche.json', JSON.stringify({prezzi:mods, foto:Object.keys(fotos), generato:new Date().toISOString()},null,1));
    var blob=await zip.generateAsync({type:'blob'});
    var a=document.createElement('a'); a.href=URL.createObjectURL(blob);
    a.download='redfox-modifiche.zip'; a.click();
    mostra('Esportate '+n+' foto + prezzi. Mandami lo zip e pubblico.');
  };

  sel.onchange=render; q.oninput=render;
  loadFotos().then(render).catch(render);
})();
</script>
</body>
</html>
